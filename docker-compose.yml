version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws/agent-events
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      APP_ENV: development
      API_PORT: 8000
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - otel-collector

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      - redis
      - otel-collector

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  otel-collector:
    image: otel/opentelemetry-collector:0.102.1
    command:
      - "--config=/etc/otelcol/config.yaml"
    volumes:
      - ./ops/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

